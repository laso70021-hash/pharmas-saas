
name: AI Reports - Every 10 Minutes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-reports-cron
  cancel-in-progress: false

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AI Reports
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_URL}"
